<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="A cat with an ember-orange coat sits on a mossy rock above moonlit Moonglade, a traveller's satchel and staff beside it and a road winding off into the hills" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1c"/><stop offset=".5" stop-color="#1a2446"/><stop offset=".8" stop-color="#2f4a5a"/><stop offset="1" stop-color="#4f7a6a"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#eef6ff"/><stop offset=".35" stop-color="#bcd6f0" stop-opacity=".55"/><stop offset="1" stop-color="#7aa0d0" stop-opacity="0"/></radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b88a8"/><stop offset="1" stop-color="#1c2f45"/></linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a3c"/><stop offset=".55" stop-color="#c2561a"/><stop offset="1" stop-color="#5a230c"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8a6a" stop-opacity=".2"/><stop offset="1" stop-color="#6a5a3a" stop-opacity=".9"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#dfeaff"><circle cx="80" cy="40" r="1.2"/><circle cx="190" cy="90" r="1"/><circle cx="260" cy="30" r="1.4"/><circle cx="420" cy="60" r="1"/><circle cx="540" cy="24" r="1.2"/><circle cx="660" cy="80" r="1"/><circle cx="980" cy="40" r="1.3"/><circle cx="1080" cy="100" r="1"/><circle cx="1150" cy="30" r="1.2"/><circle cx="350" cy="130" r=".9"/><circle cx="1010" cy="150" r=".9"/></g>
  <!-- moon over Moonglade -->
  <circle cx="820" cy="110" r="150" fill="url(#moon)"/>
  <circle cx="820" cy="110" r="44" fill="#eef6ff" opacity=".95"/>
  <circle cx="806" cy="100" r="8" fill="#c8d8ea" opacity=".6"/><circle cx="834" cy="124" r="5" fill="#c8d8ea" opacity=".5"/>
  <!-- distant mountains ringing the glade -->
  <path d="M0 250 L90 190 L170 230 L260 160 L360 225 L460 180 L560 235 L640 200 L760 240 L860 175 L960 230 L1060 185 L1200 240 V420 H0Z" fill="#1b2a3f"/>
  <path d="M0 280 Q160 240 320 268 T660 262 T1000 258 T1200 270 V420 H0Z" fill="#20393c"/>
  <!-- Lake Elune'ara with the moon's reflection -->
  <path d="M420 300 Q640 282 900 296 Q1040 304 1120 300 Q1000 322 760 324 Q560 326 420 300Z" fill="url(#lake)"/>
  <g fill="#eef6ff" opacity=".55"><rect x="800" y="298" width="40" height="2" rx="1"/><rect x="790" y="304" width="58" height="2" rx="1"/><rect x="806" y="310" width="30" height="2" rx="1"/></g>
  <!-- Nighthaven rooftops by the shore -->
  <g fill="#14262a" transform="translate(560 270)"><path d="M0 26 L18 8 L36 26Z"/><rect x="4" y="26" width="28" height="10"/><path d="M44 28 L64 6 L84 28Z"/><rect x="48" y="28" width="32" height="10"/></g>
  <g fill="#ffd27a" filter="url(#glow)"><circle cx="578" cy="301" r="2"/><circle cx="626" cy="302" r="2"/></g>
  <!-- moonwell glow -->
  <ellipse cx="700" cy="304" rx="16" ry="4" fill="#9fe0ff" opacity=".8" filter="url(#glow)"/>
  <!-- the road winding away into the hills -->
  <path d="M1200 420 Q980 380 900 352 Q820 330 760 328 Q700 326 660 330 L668 334 Q720 334 780 342 Q880 360 1000 420Z" fill="url(#road)"/>
  <!-- foreground hill -->
  <path d="M0 360 Q220 320 480 344 Q640 360 760 380 L780 420 H0Z" fill="#12201a"/>
  <!-- ancient tree on the left -->
  <g fill="#0b1510">
    <path d="M120 360 Q130 280 110 220 Q100 180 130 150 L150 160 Q128 190 140 230 Q156 290 150 360Z"/>
    <path d="M130 170 Q80 140 40 150 Q80 130 120 150Z"/><path d="M140 160 Q190 120 240 130 Q190 140 150 172Z"/>
  </g>
  <g fill="#16302a" opacity=".95"><circle cx="70" cy="140" r="46"/><circle cx="130" cy="110" r="56"/><circle cx="210" cy="126" r="48"/><circle cx="170" cy="160" r="40"/></g>
  <g fill="#7bd36a" opacity=".25"><circle cx="110" cy="96" r="20"/><circle cx="200" cy="112" r="16"/></g>
  <!-- mossy rock -->
  <path d="M300 372 Q310 330 360 322 Q420 316 446 340 Q462 360 456 380Z" fill="#26302a"/>
  <path d="M310 344 Q340 326 380 326 Q420 326 440 340 Q400 334 360 336 Q330 338 310 344Z" fill="#3e6a3a" opacity=".8"/>
  <!-- the ember-coated cat, watching the road -->
  <g transform="translate(372 266)">
    <path d="M-10 62 Q-18 40 -6 22 Q4 8 18 8 Q34 8 38 26 Q42 46 34 62Z" fill="url(#fur)"/>
    <path d="M30 6 Q34 -10 46 -12 Q58 -12 62 0 Q64 12 52 18 Q38 22 30 14Z" fill="url(#fur)"/>
    <path d="M36 -6 L38 -24 L46 -10Z M52 -12 L60 -26 L60 -6Z" fill="#c2561a"/>
    <circle cx="54" cy="0" r="2" fill="#bff58a" filter="url(#glow)"/>
    <path d="M-8 58 Q-40 60 -46 40 Q-50 24 -36 20" fill="none" stroke="#b84e18" stroke-width="7" stroke-linecap="round"/>
    <path d="M4 22 Q14 14 26 20" fill="none" stroke="#ffb76a" stroke-width="2" opacity=".6"/>
  </g>
  <!-- satchel and walking staff left beside the rock -->
  <g transform="translate(470 300)">
    <path d="M30 -110 Q26 -40 34 80" stroke="#5a3a1e" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M30 -110 Q20 -124 34 -132 Q46 -122 36 -110" fill="#3e6a3a"/>
    <path d="M28 -100 q-14 4 -12 14 q10 -2 14 -8z" fill="#7bd36a" opacity=".8"/>
    <path d="M-6 50 Q-10 20 10 16 L40 16 Q58 20 54 50 Q50 76 22 76 Q-2 76 -6 50Z" fill="#6a4426"/>
    <path d="M-2 30 Q24 44 50 30 L50 22 Q24 34 -2 22Z" fill="#4a2e18"/>
    <circle cx="24" cy="38" r="4" fill="#c69b6d"/>
    <path d="M44 22 q10 -10 6 -26" stroke="#c2561a" stroke-width="3" fill="none"/>
  </g>
  <!-- fireflies and drifting leaves -->
  <g fill="#d6ff9a" filter="url(#glow)" opacity=".85"><circle cx="260" cy="250" r="2"/><circle cx="520" cy="220" r="1.6"/><circle cx="600" cy="260" r="1.4"/><circle cx="230" cy="310" r="1.6"/><circle cx="960" cy="290" r="1.4"/></g>
  <g fill="#c2561a" opacity=".7"><path d="M640 200 q6 -6 12 0 q-6 6 -12 0z"/><path d="M1000 220 q6 -6 12 0 q-6 6 -12 0z"/></g>
  <!-- an owl crossing the moon -->
  <path d="M760 150 q12 -8 22 0 q10 -8 22 0 q-12 -3 -22 5 q-10 -8 -22 -5z" fill="#0b1224"/>
</svg>
