<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="A tailor's high window over Stormwind at night, a man with a glass of red wine and his dog, shadow curling at his feet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07060f"/><stop offset=".6" stop-color="#191433"/><stop offset="1" stop-color="#2d2147"/>
    </linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#140d0a"/><stop offset=".5" stop-color="#0c0809"/><stop offset="1" stop-color="#140d0a"/>
    </linearGradient>
    <radialGradient id="candle" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd890" stop-opacity=".85"/><stop offset=".4" stop-color="#e08a3a" stop-opacity=".25"/><stop offset="1" stop-color="#e08a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="void" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9b6bff" stop-opacity=".7"/><stop offset=".5" stop-color="#4a1f8a" stop-opacity=".35"/><stop offset="1" stop-color="#1a0833" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2efff"/><stop offset=".25" stop-color="#cfc6ff" stop-opacity=".5"/><stop offset="1" stop-color="#cfc6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="win"><path d="M380 360V120Q380 40 600 30Q820 40 820 120V360Z"/></clipPath>
  </defs>
  <!-- room -->
  <rect width="1200" height="420" fill="url(#room)"/>
  <!-- the window view -->
  <g clip-path="url(#win)">
    <rect x="380" y="20" width="440" height="350" fill="url(#sky)"/>
    <circle cx="730" cy="95" r="90" fill="url(#moon)"/>
    <circle cx="730" cy="95" r="20" fill="#ece8ff"/>
    <g fill="#d8d2ff" opacity=".7">
      <circle cx="430" cy="70" r="1.5"/><circle cx="480" cy="110" r="1"/><circle cx="530" cy="60" r="1.3"/><circle cx="600" cy="90" r="1"/><circle cx="650" cy="50" r="1.4"/><circle cx="790" cy="160" r="1"/><circle cx="560" cy="140" r="1"/>
    </g>
    <!-- Stormwind skyline -->
    <g fill="#0e0b1c">
      <path d="M380 300L380 250L410 250L410 230L425 210L440 230L440 250L470 250L470 270L500 270L500 240L520 200L540 240L540 270L560 270L560 235L575 235L575 200L590 175L605 200L605 235L620 235L620 280L650 280L650 250L668 250L668 180L682 150L696 180L696 250L720 250L720 230L745 230L745 260L770 260L770 220L785 200L800 220L800 260L820 260L820 370L380 370Z"/>
    </g>
    <g fill="#ffcf7a" opacity=".85">
      <rect x="420" y="262" width="5" height="8"/><rect x="510" y="250" width="4" height="7"/><rect x="583" y="215" width="4" height="7"/><rect x="630" y="295" width="5" height="7"/><rect x="678" y="200" width="4" height="8"/><rect x="755" y="275" width="5" height="7"/><rect x="455" y="285" width="4" height="7"/><rect x="705" y="270" width="4" height="7"/>
    </g>
    <!-- blue city haze -->
    <rect x="380" y="300" width="440" height="70" fill="#3b2f6b" opacity=".35"/>
  </g>
  <!-- window frame -->
  <path d="M380 360V120Q380 40 600 30Q820 40 820 120V360" fill="none" stroke="#2b1e18" stroke-width="18"/>
  <path d="M600 32V360M380 200H820" stroke="#2b1e18" stroke-width="8"/>
  <rect x="360" y="355" width="480" height="18" fill="#2b1e18"/>
  <!-- curtains -->
  <path d="M300 0C330 120 300 260 340 420H250C270 280 250 120 230 0Z" fill="#3a1220"/>
  <path d="M900 0C870 120 900 260 860 420H950C930 280 950 120 970 0Z" fill="#3a1220"/>
  <path d="M290 0C310 140 285 280 315 420" stroke="#55192f" stroke-width="5" fill="none"/>
  <path d="M910 0C890 140 915 280 885 420" stroke="#55192f" stroke-width="5" fill="none"/>
  <!-- tailoring table with candle, cloth, needle and wine bottle -->
  <ellipse cx="1060" cy="300" rx="170" ry="140" fill="url(#candle)"/>
  <rect x="960" y="330" width="240" height="14" fill="#3b2619"/>
  <rect x="975" y="344" width="12" height="76" fill="#2a1a11"/><rect x="1170" y="344" width="12" height="76" fill="#2a1a11"/>
  <path d="M990 330Q1020 312 1060 322Q1090 314 1120 330Z" fill="#241a3d"/>
  <path d="M1000 330Q1010 345 1004 372" stroke="#241a3d" stroke-width="10" fill="none"/>
  <rect x="1130" y="306" width="10" height="24" fill="#e9dfc4"/>
  <path d="M1135 306Q1129 296 1135 286Q1141 296 1135 306Z" fill="#ffd27a" filter="url(#glow)"/>
  <path d="M1085 330V296Q1085 288 1090 284V270H1096V284Q1101 288 1101 296V330Z" fill="#3d0d17"/>
  <path d="M1040 318L1072 310" stroke="#c9c2b0" stroke-width="2"/>
  <path d="M1072 310Q1100 300 1110 318" stroke="#9b6bff" stroke-width="1.2" fill="none" opacity=".8"/>
  <!-- left: dress form with a dark coat -->
  <ellipse cx="140" cy="300" rx="120" ry="110" fill="url(#candle)" opacity=".35"/>
  <path d="M140 140Q110 140 105 170L95 250Q100 300 140 300Q180 300 185 250L175 170Q170 140 140 140Z" fill="#1b1424"/>
  <path d="M140 140V300" stroke="#2c2238" stroke-width="2"/>
  <rect x="136" y="300" width="8" height="80" fill="#2a1a11"/><path d="M110 395L140 375L170 395" stroke="#2a1a11" stroke-width="7" fill="none"/>
  <rect x="134" y="126" width="12" height="16" fill="#2a1a11"/>
  <!-- the man, silhouetted at the window -->
  <ellipse cx="600" cy="392" rx="190" ry="34" fill="url(#void)"/>
  <g fill="#050407">
    <circle cx="560" cy="186" r="21"/>
    <path d="M548 205H574L590 220L600 300L592 380H528L522 300L530 220Z"/>
    <path d="M590 222Q615 240 622 262L612 268Q600 250 584 240Z"/>
    <path d="M532 222Q518 260 524 300L534 298Q532 262 542 236Z"/>
  </g>
  <!-- wine glass -->
  <path d="M616 252Q616 266 624 268Q632 266 632 252Z" fill="#7a0f22"/>
  <path d="M615 246H633L632 252Q632 268 624 268Q616 268 616 252Z" fill="none" stroke="#c9c2d8" stroke-width="1.3" opacity=".8"/>
  <path d="M624 268V284M617 285H631" stroke="#c9c2d8" stroke-width="1.3" opacity=".8"/>
  <!-- Maynard the dog, sitting -->
  <g fill="#050407">
    <path d="M650 382Q645 340 660 320Q668 300 688 298Q700 298 704 310L716 314Q718 322 706 324Q700 330 700 344Q712 362 712 382Z"/>
    <path d="M684 300L690 284L696 302Z"/>
    <path d="M650 380Q630 382 628 370Q634 376 650 372Z"/>
  </g>
  <!-- shadow tendrils rising from the floor -->
  <g fill="none" stroke="#8a5cf0" stroke-linecap="round" opacity=".6" filter="url(#glow)">
    <path d="M500 400Q470 360 500 330Q520 300 495 270" stroke-width="3"/>
    <path d="M540 405Q560 370 538 350" stroke-width="2"/>
    <path d="M610 402Q590 370 612 340Q630 318 618 296" stroke-width="2.5"/>
    <path d="M460 404Q440 380 452 360" stroke-width="2"/>
  </g>
  <g fill="#b48cff" opacity=".6">
    <circle cx="492" cy="262" r="2"/><circle cx="622" cy="290" r="1.6"/><circle cx="455" cy="352" r="1.5"/><circle cx="540" cy="342" r="1.4"/>
  </g>
  <!-- floor -->
  <rect y="405" width="1200" height="15" fill="#0a0607"/>
</svg>
