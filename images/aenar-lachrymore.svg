<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="A lone knight kneels at sunrise on a hill above Southshore, sword point down, with an Argent Dawn shield and two small graves beside him" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f3a"/><stop offset=".35" stop-color="#5a4a78"/><stop offset=".6" stop-color="#e08a7a"/><stop offset=".82" stop-color="#ffc878"/><stop offset="1" stop-color="#fff0c0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fffbe0"/><stop offset=".3" stop-color="#ffe08a" stop-opacity=".8"/><stop offset="1" stop-color="#ffb070" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c88a"/><stop offset="1" stop-color="#4a3a5a"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d939a"/><stop offset=".5" stop-color="#f4f2ea"/><stop offset="1" stop-color="#7a8086"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8e4dc"/><stop offset="1" stop-color="#9a958c"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <!-- rising sun and its rays -->
  <g opacity=".22" fill="#fff3c4">
    <path d="M820 236L560 0h60z"/><path d="M820 236L700 0h50z"/><path d="M820 236L840 0h50z"/><path d="M820 236L980 0h60z"/><path d="M820 236L1140 0h70z"/><path d="M820 236L1200 120v50z"/><path d="M820 236L440 40v40z"/>
  </g>
  <circle cx="820" cy="236" r="200" fill="url(#sun)"/>
  <circle cx="820" cy="236" r="44" fill="#fffbe0" filter="url(#glow)"/>
  <!-- thin morning clouds -->
  <g fill="#ffd9a0" opacity=".45"><path d="M80 110q220 -22 460 4q-230 8 -460 -4z"/><path d="M620 70q240 -18 520 8q-260 6 -520 -8z"/><path d="M180 180q160 -10 360 4q-180 6 -360 -4z"/></g>
  <!-- far hills of Alterac to the north -->
  <path d="M0 262 Q140 220 300 244 T600 236 T900 246 T1200 232V300H0Z" fill="#7a5a78" opacity=".55"/>
  <!-- the sea off Southshore -->
  <rect x="0" y="270" width="1200" height="60" fill="url(#sea)"/>
  <g stroke="#fff0c0" stroke-width="2" opacity=".55" stroke-linecap="round"><path d="M700 282h60M790 290h80M860 280h40M740 298h50M900 296h60M620 292h40"/></g>
  <!-- Southshore: docks, rooftops and the inn -->
  <g fill="#3e2e44" transform="translate(120 238)">
    <rect x="0" y="22" width="40" height="22"/><path d="M-4 22l24 -16l24 16z"/>
    <rect x="50" y="14" width="56" height="30"/><path d="M46 14l32 -20l32 20z"/><rect x="74" y="-14" width="6" height="12"/>
    <rect x="116" y="26" width="34" height="18"/><path d="M112 26l21 -14l21 14z"/>
    <rect x="160" y="18" width="44" height="26"/><path d="M156 18l26 -18l26 18z"/>
    <rect x="214" y="28" width="30" height="16"/><path d="M210 28l19 -12l19 12z"/>
    <rect x="0" y="44" width="330" height="6"/>
    <g><rect x="250" y="44" width="80" height="4"/><rect x="258" y="44" width="3" height="18"/><rect x="288" y="44" width="3" height="18"/><rect x="318" y="44" width="3" height="18"/></g>
    <path d="M300 30v14M300 30l16 10h-16z"/>
  </g>
  <!-- a few gulls -->
  <g fill="none" stroke="#3e2e44" stroke-width="2" stroke-linecap="round"><path d="M520 150q8 -6 14 0q6 -6 14 0"/><path d="M560 128q6 -5 11 0q5 -5 11 0"/><path d="M470 172q6 -5 11 0q5 -5 11 0"/></g>
  <!-- the near hill where the orchard used to be -->
  <path d="M0 340 Q240 300 520 318 T1000 312 T1200 326V420H0Z" fill="#2a1e2c"/>
  <path d="M0 380 Q300 346 640 360 T1200 370V420H0Z" fill="#160f18"/>
  <!-- an old apple tree, bare -->
  <g stroke="#160f18" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M1040 362v-70M1040 312l-28 -26M1040 300l30 -30M1012 286l-16 -4M1070 270l14 -16M1040 292l4 -30"/>
  </g>
  <!-- two small graves -->
  <g fill="#160f18">
    <path d="M300 372v-30q0 -12 12 -12q12 0 12 12v30z"/>
    <path d="M340 374v-24q0 -10 10 -10q10 0 10 10v24z"/>
  </g>
  <g fill="#ffe08a" opacity=".85"><circle cx="312" cy="348" r="2"/><circle cx="350" cy="356" r="2"/></g>
  <!-- the kneeling knight, facing north with his back to the sun -->
  <g transform="translate(560 252)" fill="#120c14">
    <ellipse cx="10" cy="118" rx="110" ry="10" fill="#000" opacity=".35"/>
    <!-- cape -->
    <path d="M-10 18q-30 40 -36 96h70l-6 -96z"/>
    <!-- body and head -->
    <path d="M-8 14h36l4 50h-44z"/>
    <circle cx="10" cy="0" r="14"/>
    <path d="M-4 -4q14 -14 28 0q-2 12 -6 18l-4 -2q2 -8 -4 -10q-6 2 -6 12h-6z" fill="#d8b860"/>
    <!-- kneeling legs -->
    <path d="M-6 62h30l26 22v34h-14v-24l-18 -12h-24z"/>
    <path d="M-10 62l-8 56h40v-10h-24l4 -46z"/>
    <!-- arms resting on the pommel -->
    <path d="M24 26l30 22v10l-34 -18z"/>
  </g>
  <!-- the sword, point driven into the hill -->
  <g transform="translate(616 256)">
    <rect x="-3" y="44" width="10" height="66" fill="url(#steel)"/>
    <path d="M-3 110h10l-5 10z" fill="#9aa0a6"/>
    <rect x="-16" y="38" width="36" height="7" rx="3" fill="#c9a14a"/>
    <rect x="-1" y="18" width="6" height="20" fill="#3a2a1a"/>
    <circle cx="2" cy="16" r="5" fill="#c9a14a"/>
  </g>
  <!-- Argent Dawn shield propped against the graves' hill -->
  <g transform="translate(450 318)">
    <path d="M0 0h56v26q0 26 -28 40q-28 -14 -28 -40z" fill="url(#shield)" stroke="#c9a14a" stroke-width="3"/>
    <g fill="#c9a14a"><circle cx="28" cy="26" r="9"/><path d="M28 6l3 10h-6zM28 46l3 -10h-6zM8 26l10 3v-6zM48 26l-10 3v-6zM14 12l9 7l-3 3zM42 12l-9 7l3 3zM14 40l9 -7l-3 -3zM42 40l-9 -7l3 -3z"/></g>
  </g>
  <!-- motes of light -->
  <g fill="#fff3c4" opacity=".8"><circle cx="700" cy="200" r="1.6"/><circle cx="760" cy="160" r="1.4"/><circle cx="660" cy="230" r="1.2"/><circle cx="900" cy="190" r="1.6"/><circle cx="980" cy="230" r="1.2"/></g>
</svg>
